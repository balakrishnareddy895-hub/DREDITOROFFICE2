name: Build DR Editor Office APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wrap HTML App and Build APK
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/
          else
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              unzip -q "$ZIP_FILE" -d temp_ext
              FOUND_HTML=$(find temp_ext -name "index.html" | head -n 1)
              if [ -n "$FOUND_HTML" ]; then
                cp -r "$(dirname "$FOUND_HTML")"/* www/
              fi
            fi
          fi

          if [ ! -f "www/index.html" ]; then
            echo "ERROR: Please upload index.html to the main page of DREDITOROFFICE2 first!"
            exit 1
          fi

          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "DREDITOROFFICE" "com.dreditoroffice.app" --web-dir=www
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../DREDITOROFFICE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DR-Editor-Office-APK
          path: DREDITOROFFICE.apk
          
